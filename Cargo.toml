[package]
name = "autohide-desktop-icons"
version = "2.0.0"
edition = "2024"

[dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2.191"
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
